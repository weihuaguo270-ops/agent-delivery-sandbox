[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-delivery-sandbox"
version = "0.1.0"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=7,<10"]

[project.scripts]
agent-delivery-control-plane = "sandbox_service.control_plane:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sandbox_service*"]
